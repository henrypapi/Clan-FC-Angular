# ============================================================================
# TiendaMenos — Configuración principal (Entregable 1)
# Perfil por defecto: PostgreSQL local. Ajusta usuario/contraseña a tu entorno.
# ============================================================================

spring.application.name=backend
# 1. Corrección del puerto para Render
server.port=${PORT:8080}

# ---------------------------- PostgreSQL ------------------------------------
# La BD "tiendamenos" se crea ejecutando database/schema.sql (ver README).
# 2 y 3. Corrección a formato JDBC sin credenciales en la URL
spring.datasource.url=jdbc:postgresql://db.bambomecfksmygpbpdyg.supabase.co:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------------------------- JPA / Hibernate -------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------- IVA parametrizable ----------------------------
tienda.iva.general=16
tienda.iva.reducido=8
tienda.iva.exento=0

# ---------------------------- Logging ---------------------------------------
logging.level.org.springframework.security=INFO

# ---------------------------- JWT -------------------------------------------
security.jwt.secret=${JWT_SECRET:dGllbmRhbWVub3Mtand0LXNlY3JldC1kZXNhcnJvbGxvLTIwMjYtMzItYnl0ZXM=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}