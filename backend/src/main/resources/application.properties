# ============================================================================
# TiendaMenos — Configuración principal (Entregable 1)
# Perfil por defecto: PostgreSQL local. Ajusta usuario/contraseña a tu entorno.
# ============================================================================

spring.application.name=backend
server.port=8080

# ---------------------------- PostgreSQL ------------------------------------
# La BD "tiendamenos" se crea ejecutando database/schema.sql (ver README).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tiendamenos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---------------------------- JPA / Hibernate -------------------------------
# validate: el esquema lo administra database/schema.sql (fuente de verdad).
# Si aún no ejecutaste el script, puedes usar "update" temporalmente para que
# Hibernate cree las tablas, pero la práctica recomendada es validate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------- IVA parametrizable ----------------------------
# Tasas por defecto para CONSUMIDOR FINAL (sin empresa asociada).
# Las ventas B2B usan la tasa de SU empresa (empresas_clientes.tasa_iva).
tienda.iva.general=16
tienda.iva.reducido=8
tienda.iva.exento=0

# ---------------------------- Logging ---------------------------------------
logging.level.org.springframework.security=INFO

# ---------------------------- JWT -------------------------------------------
# En producción define JWT_SECRET con una clave Base64 aleatoria de 32+ bytes.
# La clave incluida sirve únicamente para desarrollo local y demostración.
security.jwt.secret=${JWT_SECRET:dGllbmRhbWVub3Mtand0LXNlY3JldC1kZXNhcnJvbGxvLTIwMjYtMzItYnl0ZXM=}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
